		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":56172840,"index.wasm":35740641},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG); window.godotEngine = engine;

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());

<style>
  #smbUI, #smbUI * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  }
  #smbTop button:hover { background: rgba(30, 34, 46, .95); }
  #smbTop button.primary { background: #e52521; border-color: #ff6a63; }

  #smbSizeWrap {

  #smbSizeLabel { font-size: 11px; font-weight: 700; color: #ffe9a3; min-width: 34px; text-align: center; }

  #smbTouch { position: absolute; inset: 0; display: none; pointer-events: none; }

  /* --- D-pad (cross shape, supports sliding between directions) --- */

  #smbDpadCore {

  /* --- A / B / START --- */
  #smbButtons { position: absolute; right: 22px; bottom: 24px; width: 172px; height: 186px; pointer-events: auto; touch-action: none; }
  .smbRound {
    position: absolute; width: 76px; height: 76px; border-radius: 50%;

    border: 2px solid rgba(255,255,255,.28);

  #smbA.on, #smbB.on { filter: brightness(1.35); transform: scale(.96); }
  #smbRun {
    position: absolute; right: 0; bottom: 116px; width: 76px; height: 46px;

    box-shadow: 0 8px 18px -8px rgba(0,0,0,.8);
    -webkit-user-select: none; user-select: none;
  }
  #smbRun.on { background: #ffd93d; box-shadow: 0 0 20px rgba(251,208,0,.9); transform: scale(.97); }
  #smbStart {
    position: absolute; left: 0; top: 0; height: 34px; padding: 0 14px;
    border-radius: 17px; background: rgba(18,21,31,.8); border: 2px solid rgba(255,255,255,.2);
    color: #dbe4ff; font-size: 11px; font-weight: 700; letter-spacing: .1em;
    display: grid; place-items: center; -webkit-user-select: none; user-select: none;
  }
  #smbStart.on { background: rgba(67,176,71,.85); border-color: #8ee092; }

  #smbTouch { --pad-scale: 1; }
  #smbDpad { transform: scale(var(--pad-scale)); transform-origin: bottom left; }
  #smbButtons { transform: scale(var(--pad-scale)); transform-origin: bottom right; }

  .smbHint { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.4); font-size: 11px; white-space: nowrap; }
  #smbRomMsg { position: absolute; top: 58px; right: 10px; max-width: 340px; padding: 10px 12px; border-radius: 10px; background: rgba(12,14,20,.94); border: 1px solid rgba(255,255,255,.18); color: #ffe9a3; font-size: 12.5px; display: none; }

<script>
(function () {
  var KEYS = {
    left:  { keyCode: 37, key: "ArrowLeft",  code: "ArrowLeft" },
    right: { keyCode: 39, key: "ArrowRight", code: "ArrowRight" },
    up:    { keyCode: 38, key: "ArrowUp",    code: "ArrowUp" },
    down:  { keyCode: 40, key: "ArrowDown",  code: "ArrowDown" },
    a:     { keyCode: 90, key: "z",          code: "KeyZ" },
    b:     { keyCode: 88, key: "x",          code: "KeyX" },
    start: { keyCode: 27, key: "Escape",      code: "Escape" }
  };

  function toast(text, ms) {
    var el = document.getElementById("smbRomMsg");
    el.textContent = text;
    el.style.display = "block";
    if (ms) setTimeout(function () { el.style.display = "none"; }, ms);
  }

  function fire(name, down) {
    var k = KEYS[name];
    if (!k) return;
    [document.getElementById("canvas"), document, window].forEach(function (t) {
      if (!t) return;
      t.dispatchEvent(new KeyboardEvent(down ? "keydown" : "keyup", {
        key: k.key, code: k.code, keyCode: k.keyCode, which: k.keyCode,
        bubbles: true, cancelable: true
      }));
    });
  }

  /* ---------------- D-pad with drag support ---------------- */
  var pad = document.getElementById("smbDpad");
  var dirEls = { left: pad.querySelector(".left"), right: pad.querySelector(".right"), up: pad.querySelector(".up"), down: pad.querySelector(".down") };
  var activeDir = null;

  function dirFromPoint(clientX, clientY) {
    var r = pad.getBoundingClientRect();
    var x = clientX - (r.left + r.width / 2);
    var y = clientY - (r.top + r.height / 2);
    var dead = r.width * 0.10;
    if (Math.abs(x) < dead && Math.abs(y) < dead) return null;
    if (Math.abs(x) > Math.abs(y)) return x < 0 ? "left" : "right";
    return y < 0 ? "up" : "down";
  }

  function setDir(dir) {
    if (dir === activeDir) return;
    if (activeDir && dirEls[activeDir]) dirEls[activeDir].classList.remove("on");
    if (activeDir) fire(activeDir, false);
    activeDir = dir;
    if (activeDir && dirEls[activeDir]) dirEls[activeDir].classList.add("on");
    if (activeDir) fire(activeDir, true);
  }

  pad.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    setDir(dirFromPoint(e.clientX, e.clientY));
  });
  pad.addEventListener("pointermove", function (e) {
    if (activeDir === null && e.buttons === 0 && e.pointerType === "mouse") return;
    if (e.buttons === 0 && e.pointerType !== "touch" && e.pointerType !== "pen") return;
    setDir(dirFromPoint(e.clientX, e.clientY));
  });
  pad.addEventListener("pointerup", function (e) { e.preventDefault(); setDir(null); });
  pad.addEventListener("pointercancel", function () { setDir(null); });
  pad.addEventListener("pointerleave", function () { setDir(null); });
  pad.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  /* ---------------- A / B / START ---------------- */
  document.querySelectorAll("#smbButtons [data-k]").forEach(function (el) {
    var name = el.getAttribute("data-k");
    var press = function (e) { e.preventDefault(); el.classList.add("on"); fire(name, true); };
    var release = function (e) { e.preventDefault(); el.classList.remove("on"); fire(name, false); };
    el.addEventListener("pointerdown", press);
    el.addEventListener("pointerup", release);
    el.addEventListener("pointercancel", release);
    el.addEventListener("pointerleave", release);
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  });

  /* ---------------- RUN (mantiene B) ---------------- */
  var runHeld = false;
  var runBtn = document.getElementById("smbRun");
  runBtn.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    runHeld = !runHeld;
    runBtn.classList.toggle("on", runHeld);
    fire("b", runHeld);
  });
  runBtn.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  /* ---------------- toolbar ---------------- */
  var touch = document.getElementById("smbTouch");
  document.getElementById("smbToggle").addEventListener("click", function () {
    touch.classList.toggle("on");
    try { localStorage.setItem("smb_touch", touch.classList.contains("on") ? "1" : "0"); } catch (e) {}
  });

  /* tamaño de los controles (barra deslizante) */
  var sizeRange = document.getElementById("smbSizeRange");
  var sizeLabel = document.getElementById("smbSizeLabel");
  try {
    var storedScale = parseFloat(localStorage.getItem("smb_pad_scale"));
    if (!isNaN(storedScale) && storedScale >= 0.7 && storedScale <= 1.6) {
      sizeRange.value = String(storedScale);
    }
  } catch (e) {}
  function applyPadScale() {
    var value = parseFloat(sizeRange.value);
    touch.style.setProperty("--pad-scale", String(value));
    sizeLabel.textContent = Math.round(value * 100) + "%";
    try { localStorage.setItem("smb_pad_scale", String(value)); } catch (e) {}
  }
  sizeRange.addEventListener("input", applyPadScale);
  sizeRange.addEventListener("change", applyPadScale);
  applyPadScale();

  var full = document.getElementById("smbFull");  full.addEventListener("click", function () {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      var root = document.documentElement;
      var req = root.requestFullscreen || root.webkitRequestFullscreen;
      if (req) req.call(root).catch(function () {});
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  });
  document.addEventListener("fullscreenchange", function () {
    full.textContent = document.fullscreenElement ? "⛶ Salir" : "⛶ Pantalla completa";
  });

  /* ---------------- ROM picker ---------------- */
  var input = document.getElementById("smbRomFile");
  document.getElementById("smbRom").addEventListener("click", function () {
    input.value = "";
    input.click();
  });
  input.addEventListener("change", async function () {
    var file = input.files && input.files[0];
    if (!file) return;
    try {
      toast("Cargando ROM…");
      var bytes = new Uint8Array(await file.arrayBuffer());
      // 1) localStorage: survives reloads and is read by the game on boot.
      var bin = "";
      for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      localStorage.setItem("smb_rom", btoa(bin));
      localStorage.setItem("smb_rom_name", file.name);
      // 2) Best effort: also drop it into the virtual filesystem.
      try {
        var engine = window.godotEngine;
        if (engine && typeof engine.copyToFS === "function") engine.copyToFS("/userfs/baserom.nes", bytes);
      } catch (err) { /* the game imports from localStorage anyway */ }
      toast("ROM guardada. Reiniciando…", 3000);
      setTimeout(function () { location.reload(); }, 600);
    } catch (err) {
      console.error(err);
      toast("No se pudo leer la ROM: " + err, 8000);
    }
  });

  /* ---------------- defaults ---------------- */
  var isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  var saved = null;
  try { saved = localStorage.getItem("smb_touch"); } catch (e) {}
  if (saved === "1" || (isTouch && saved !== "0")) touch.classList.add("on");

  setTimeout(function () {
    var name = null;
    try { name = localStorage.getItem("smb_rom_name"); } catch (e) {}
    if (name) toast("ROM cargada: " + name + " · Pulsa 📁 ROM para cambiarla", 7000);
    else toast("¿Te pide la ROM? Pulsa 📁 ROM y elige tu archivo .nes", 9000);
  }, 9000);
})();
</script>
